name: Build executables

# PyInstaller is not a cross-compiler — a Windows .exe has to be built on
# Windows, a Mac binary on a Mac. GitHub's runners provide both, so this is
# how the downloads on the Releases page are produced.
#
#   • every push / PR touching the app → build both, keep them as artifacts
#     you can download from the run's summary page (kept 30 days)
#   • push a tag like v1.0 → the same binaries are attached to a Release
#
# Run it by hand any time from the Actions tab → Build executables → Run
# workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release step

jobs:
  build:
    strategy:
      fail-fast: false   # a Mac failure shouldn't hide a working .exe
      matrix:
        include:
          - os: windows-latest
            artifact: PyWR-Reader-Windows
            binary: dist/PyWR Reader.exe
          - os: macos-latest
            artifact: PyWR-Reader-macOS
            binary: dist/PyWR Reader
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller bundles what it can import, so the app's own requirements
      # have to be installed alongside it, not just in some other environment
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build_exe.py

      # Proof the thing actually starts: run it on a spare port and ask it for
      # a page. A binary that builds but dies on launch is the failure mode
      # worth catching here — it is invisible until someone downloads it.
      - name: Smoke-test the binary
        shell: bash
        run: |
          # keep the binary's own output — without it a failure here says only
          # "could not connect", which is the symptom and never the reason
          "${{ matrix.binary }}" --no-open > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null "http://127.0.0.1:5321/"; then
              echo "started and served the page"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "the binary exited on its own; its output was:"
              cat server.log
              exit 1
            fi
            sleep 2
          done
          echo "the binary never served a page; its output was:"
          cat server.log
          kill $pid 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # One job publishes, after both builds pass. Letting each build attach its
  # own file means two jobs racing to create the same release, and a release
  # is the one thing here that is public and awkward to take back.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # "PyWR Reader.exe" becomes "PyWR.Reader.exe" as an asset name, and says
      # nothing about which machine it is for. Name them for the download list.
      - name: Name the downloads by platform
        run: |
          mkdir -p out
          cp "artifacts/PyWR-Reader-Windows/PyWR Reader.exe" \
             "out/PyWR-Reader-${{ github.ref_name }}-Windows.exe"
          cp "artifacts/PyWR-Reader-macOS/PyWR Reader" \
             "out/PyWR-Reader-${{ github.ref_name }}-macOS"
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          name: PyWR Reader ${{ github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
          body: |
            Open a PyWR water resource model and actually see it — the network
            draws itself, clicking a node lights up where its water comes from
            and goes to, and one button runs the model and plays the flows back
            through every pipe.

            ## Download and run — no Python needed

            | Your machine | Download | Then |
            |---|---|---|
            | **Windows** | `PyWR-Reader-${{ github.ref_name }}-Windows.exe` | Double-click it |
            | **macOS** | `PyWR-Reader-${{ github.ref_name }}-macOS` | Right-click → **Open**, then **Open** |

            It carries its own Python and Flask, starts, and opens your browser.
            No pip, no admin rights. The first launch takes a few seconds longer
            while it unpacks itself.

            Neither build is code-signed, so both systems warn about an
            unidentified developer the first time: on macOS use right-click →
            Open, on Windows **More info → Run anyway**.

            To *run* models (rather than read and edit them) it sets up pywr on
            demand into a `.pywr-env` folder **next to the executable** — so keep
            the executable somewhere writable, like your Desktop.

            ## Or run it from source

            Python 3.9+, then `python3 app.py` (Windows: `py app.py`). It
            installs its one dependency itself on first run. There are
            double-click launchers in the folder too.

            See the [README](https://github.com/ShaliniBalaram/PYWR_reader#readme)
            for everything it does.
